<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kızıl Ressam — Gülşen</title>
  <meta name="description" content="Kızıl Ressam — Gülşen kişisel sanat galerisi ve eser arşivi." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%239E1B24'/%3E%3Cpath d='M20 42 C26 24, 38 18, 46 20 C42 30, 34 40, 20 42 Z' fill='%23FAF7F2'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Açılış Çizim Animasyonu -->
  <div id="intro-overlay" class="intro-overlay" aria-hidden="true">
    <div class="intro-content">
      <svg class="intro-sketch" viewBox="0 0 360 220" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Dış çerçeve eskiz çizgileri -->
        <path class="draw-line delay-1" d="M32 30 L328 30 L328 190 L32 190 Z" stroke="currentColor" stroke-width="1.1" stroke-dasharray="1000" stroke-dashoffset="1000" />
        <path class="draw-line delay-2" d="M40 22 L40 198 M320 22 L320 198" stroke="currentColor" stroke-width="0.7" opacity="0.45" stroke-dasharray="400" stroke-dashoffset="400" />

        <!-- Tek çizgi (continuous line-art) sanatçı/botanik figürü -->
        <path class="draw-line delay-2" d="M95 148 C108 118, 128 84, 152 68 C166 59, 178 66, 176 82 C174 102, 148 124, 165 138 C182 152, 206 112, 224 88 C236 72, 254 78, 248 98 C242 118, 220 132, 242 146 C255 154, 272 142, 282 126" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="900" stroke-dashoffset="900" />

        <!-- İnce yaprak/fırça detayı -->
        <path class="draw-line delay-3" d="M152 68 C144 50, 156 42, 164 52 C168 58, 160 66, 152 68 Z" stroke="currentColor" stroke-width="1.3" stroke-dasharray="150" stroke-dashoffset="150" />

        <!-- Kızıl fırça darbesi -->
        <path class="brush-stroke" d="M72 166 C135 158, 225 156, 290 164" stroke="#A61C28" stroke-width="9" stroke-linecap="round" stroke-dasharray="260" stroke-dashoffset="260" />
      </svg>

      <div class="intro-title" id="intro-title">Kızıl Ressam — Gülşen</div>
      <button type="button" id="intro-skip" class="intro-skip">Galeriye Geç</button>
    </div>
  </div>

  <!-- Üst Menü -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="#" class="brand" id="brand-link">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-text" id="site-title">Kızıl Ressam — Gülşen</span>
      </a>

      <nav class="header-actions" aria-label="Site kontrolleri">
        <button type="button" id="about-btn" class="nav-btn hidden">Hakkında</button>
        <button type="button" id="replay-intro-btn" class="icon-btn hidden" title="Açılış Çizimini İzle" aria-label="Açılış Çizimini İzle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19l7-7 3 3-7 7-3-3z"/>
            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
            <path d="M2 2l7.586 7.586"/>
          </svg>
        </button>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Tema Değiştir">
          <span class="theme-icon" id="theme-icon" aria-hidden="true"></span>
          <span class="theme-label" id="theme-label">Işıkları Kapat</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Ana İçerik -->
  <main class="container main-content">
    <!-- Kategoriler (Yalnızca panelden kategori girilirse otomatik görünür) -->
    <section id="filter-bar" class="filter-bar hidden" aria-label="Kategori filtreleri"></section>

    <!-- Galeri -->
    <section aria-label="Sanat Eserleri Galerisi">
      <div id="gallery-grid" class="gallery-masonry"></div>
      <div id="empty-state" class="empty-state hidden">
        <p>Henüz eser eklenmemiş.</p>
      </div>
    </section>
  </main>

  <!-- Alt Bilgi -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-copy" id="footer-copy">© <span id="current-year"></span> Kızıl Ressam — Gülşen</p>
      <div id="social-links" class="social-links hidden"></div>
    </div>
  </footer>

  <!-- Tam Ekran Eser İnceleme (Lightbox) -->
  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-labelledby="lightbox-title">
    <button type="button" id="lightbox-close" class="lightbox-close" aria-label="Kapat">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>

    <button type="button" id="lightbox-prev" class="lightbox-nav lightbox-prev" aria-label="Önceki eser">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <div class="lightbox-body">
      <div class="lightbox-image-wrap">
        <img id="lightbox-img" src="" alt="" />
      </div>
      <div class="lightbox-info">
        <span id="lightbox-category" class="lightbox-badge hidden"></span>
        <h2 id="lightbox-title" class="lightbox-title"></h2>
        <p id="lightbox-meta" class="lightbox-meta hidden"></p>
        <p id="lightbox-story" class="lightbox-story hidden"></p>
      </div>
    </div>

    <button type="button" id="lightbox-next" class="lightbox-nav lightbox-next" aria-label="Sonraki eser">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>
  </div>

  <!-- Hakkında Penceresi (Panelden metin girilirse aktif olur) -->
  <div id="about-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="about-heading">
    <div class="modal-card">
      <button type="button" id="about-close" class="modal-close" aria-label="Kapat">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
      <span class="modal-eyebrow">Sanatçı Hakkında</span>
      <h2 id="about-heading" class="modal-title">Kızıl Ressam — Gülşen</h2>
      <p id="about-content" class="modal-text"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
